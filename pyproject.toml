[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lune-lang"
# The version lives in lune/__init__.py (`__version__`) so that the package
# metadata, `lune --version` and the REPL banner cannot drift apart.
dynamic = ["version"]
description = "A teaching-first lazy functional language whose diagnostics speak your native language"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hiroshi Koide", email = "koide.hiroshi.934@m.kyushu-u.ac.jp" }]
keywords = [
    "programming-language",
    "interpreter",
    "lazy-evaluation",
    "functional-programming",
    "compiler",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Natural Language :: Japanese",
    "Natural Language :: English",
]
# The interpreter is pure Python and depends only on the standard library.
dependencies = []

[project.urls]
Homepage = "https://koide55.github.io/lune-lang/"
Playground = "https://koide55.github.io/lune-lang/playground/"
Repository = "https://github.com/koide55/lune-lang"
Documentation = "https://koide55.github.io/lune-lang/book/"
Issues = "https://github.com/koide55/lune-lang/issues"

[project.scripts]
# `main(argv=None)` reads sys.argv[1:] itself and returns an exit code, so the
# console script needs no wrapper. `bin/lune` stays for git-clone users.
lune = "lune.cli:main"

[tool.hatch.version]
path = "lune/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lune"]

[tool.hatch.build.targets.sdist]
# Anchored with a leading slash: unanchored patterns match at any depth, which
# quietly pulled in bin/lune (a file named `lune`) and every nested README.md.
include = ["/lune", "/tests", "/samples", "/documents", "/README.md", "/LICENSE"]
