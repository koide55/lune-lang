<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lune Playground</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<style>
  :root {
    --bg: #1e1f26; --panel: #26272f; --border: #3a3b45;
    --fg: #e8e8ee; --dim: #9a9ab0; --accent: #7aa2f7;
    --err: #f7768e; --warn: #e0af68; --hint: #9ece6a; --help: #7dcfff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "Hiragino Sans", sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .nav { font-size: 12px; }
  header .nav a { color: var(--accent); text-decoration: none; }
  #status { margin-left: auto; font-size: 12px; color: var(--dim); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
         padding: 10px 16px; height: calc(100vh - 46px); }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select, input[type=text] {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: wait; }
  button.primary { background: var(--accent); color: #14141a; font-weight: 600; }
  input[type=text] { width: 90px; cursor: text; font-family: ui-monospace, monospace; }
  textarea, #output {
    flex: 1; width: 100%; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    line-height: 1.5; resize: none; white-space: pre; overflow: auto; margin: 0; }
  textarea:focus { outline: 1px solid var(--accent); }
  #output .e { color: var(--err); font-weight: 600; }
  #output .w { color: var(--warn); }
  #output .h { color: var(--hint); }
  #output .x { color: var(--help); }
  #output .tf { color: var(--accent); }
  #output .tm { color: var(--hint); }
  #output .tv { color: var(--dim); }
  #output a.diag { color: inherit; text-decoration: underline dotted; cursor: pointer; }
  label { font-size: 12px; color: var(--dim); }
  /* file tabs: main.lune plus the modules it imports */
  .files { gap: 4px; margin-bottom: -4px; }
  button.file { border-radius: 6px 6px 0 0; border-bottom-color: transparent;
    color: var(--dim); padding: 5px 10px; font-family: ui-monospace, monospace; font-size: 12px; }
  button.file.active { color: var(--fg); border-color: var(--accent); }
  button.file .close { color: var(--dim); margin-left: 6px; font-family: sans-serif; }
  button.file .close:hover { color: var(--err); }
  #btn-add-module { padding: 5px 10px; font-size: 12px; }
  /* right-column tabs: 出力 / REPL */
  .tabs { gap: 4px; }
  .tabfill { flex: 1; }
  button.tab { border-radius: 6px 6px 0 0; border-bottom-color: transparent;
    color: var(--dim); padding: 6px 14px; }
  button.tab.active { color: var(--fg); border-color: var(--accent); }
  #repl { flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  /* an author `display` beats the UA rule for [hidden], so restate it */
  #repl[hidden] { display: none; }
  #repl-log { flex: 1; margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; background: none; border: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.5; }
  #repl-log .e { color: var(--err); font-weight: 600; }
  #repl-log .w { color: var(--warn); }
  #repl-log .h { color: var(--hint); }
  #repl-log .x { color: var(--help); }
  #repl-log .tf { color: var(--accent); }
  #repl-log .tm { color: var(--hint); }
  #repl-log .tv { color: var(--dim); }
  #repl-log .echo { color: var(--dim); }
  #repl-log a.diag { color: inherit; text-decoration: underline dotted; cursor: pointer; }
  .repl-input { display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--border); padding: 8px 12px; }
  #repl-prompt { color: var(--accent); font-family: ui-monospace, monospace; font-size: 13px; }
  #repl-line { flex: 1; width: auto; background: none; border: none; color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; padding: 0; }
  #repl-line:focus { outline: none; }
  /* CodeMirror: match the page palette */
  .CodeMirror { flex: 1; height: auto; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.5; }
  .CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--border); }
  .CodeMirror-linenumber { color: var(--dim); }
  .CodeMirror-cursor { border-left: 1px solid var(--fg); }
  .CodeMirror-selected { background: rgba(122, 162, 247, 0.18); }
  .CodeMirror-focused .CodeMirror-selected { background: rgba(122, 162, 247, 0.25); }
  .cm-s-default .cm-keyword { color: var(--accent); }
  .cm-s-default .cm-string { color: var(--hint); }
  .cm-s-default .cm-comment { color: var(--dim); }
  .cm-s-default .cm-number { color: var(--warn); }
  .cm-s-default .cm-atom { color: var(--warn); }
  .cm-s-default .cm-variable-2 { color: var(--help); }
  .cm-s-default .cm-operator { color: var(--fg); }
  .cm-error-line { background: rgba(247, 118, 142, 0.14); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; }
    textarea, #output, .CodeMirror, #repl { min-height: 40vh; } }
</style>
</head>
<body>

  <h1>Lune Playground</h1>
  <span class="sub">ブラウザの中の部室 — 処理系(Pure Python)を Pyodide 上でそのまま実行</span>
  <span class="nav"><a href="../">トップ</a> · <a href="errors.html">診断カタログ</a></span>
  <span id="status">Pyodide を読み込み中…</span>

<main>
  <div class="col">
    <div class="toolbar">

      <button id="btn-new" title="エディタを空にして書き始める">新規</button>
      <button id="btn-open" title="ローカルの .lune ファイルをエディタに読み込む">開く</button>
      <button id="btn-save" title="エディタの内容を .lune ファイルとして保存">保存</button>
      <input type="file" id="file-input" accept=".lune,text/plain" hidden>

      <button id="btn-repl-reset" class="repl-only" disabled>リセット</button>

        <span id="repl-prompt">lune&gt;</span>
        <input type="text" id="repl-line" spellcheck="false" autocomplete="off"
               placeholder="式や宣言を入力して Enter（↑↓ で履歴）" disabled>
      </div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/mode/simple.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const PRESETS = {
  basics: {
    binding: "total",
    code: `let numbers = range(1, 10)
let doubled = map(numbers, fn x: Int -> x * 2)
let evens = filter(doubled, fn x: Int -> x % 4 == 0)
let total = fold(evens, 0, fn acc: Int x: Int -> acc + x)
`,
  },
  exhaustive: {
    binding: "",
    code: `type Color =
    | Red
    | Green
    | Blue

def name(c: Color): String =
    match c:
        | Red -> "red"
        | Green -> "green"
`,
  },
  typo: {
    binding: "total",
    code: `let count = 10
let total = cont + 5
`,
  },
  stream: {
    binding: "firstThree",
    trace: true,
    code: `let nat = naturalsFrom(1)
let evens = filter(nat, fn x: Int -> x % 2 == 0)
let firstThree = take(evens, 3)
`,
  },
  modules: {
    binding: "answer",
    code: `module main

import geometry

let answer = area(3.0, 4.0)
`,
    // Extra files are keyed by the import path, exactly as the tabs are.
    modules: [
      {
        name: "geometry",
        code: `module geometry

def area(width: Double, height: Double): Double =
    width * height
`,
      },
    ],
  },
};

const LUNE_FILES = ["__init__.py","cli.py","diagnostics.py","evaluator.py",
  "explanations.py","explanations_ja.py","fixer.py","formatter.py","layout.py",
  "lexer.py","messages.py","module_loader.py","nodes.py","parser.py","repl.py",
  "tokens.py","typechecker.py"];

const DRIVER = `
import io, json, os, sys, contextlib
sys.path.insert(0, "/app")

from lune.diagnostics import SourceMap, format_diagnostic, format_exception
from lune.module_loader import check_file, eval_file
from lune.evaluator import format_value, set_trace_hook
from lune.messages import set_language
from lune.explanations import render_explanation, available_codes
from lune.formatter import format_source
from lune.fixer import apply_fixes
from lune.repl import ReplSession, wants_more
from lune.parser import parse_source
from lune import nodes as ast
from lune import __version__ as LUNE_VERSION

ENTRY = "/app/main.lune"

def lune_bindings(source):
    """Top-level *value* binding names in source order, as JSON.

    Uses the real parser rather than a regex so that a \`let\` inside a string
    or a nested block is not mistaken for a declaration. Returns null when the
    source does not parse — the caller keeps whatever it already had, which is
    what you want while someone is still typing.
    """
    try:
        module = parse_source(source, "main.lune")
    except Exception:
        return json.dumps(None)
    names = []
    for decl in module.declarations:
        if isinstance(decl, ast.LetDecl) and isinstance(decl.pattern, ast.NamePattern):
            names.append(decl.pattern.name)
        elif isinstance(decl, ast.VarDecl):
            names.append(decl.name)
    return json.dumps(names)

# Files written for the last run, so that a module the user deleted really
# disappears. A stale /app/math.lune would go on resolving \`import math\`, and
# the program would keep working here but not anywhere else.
_WRITTEN = set()

def _module_file(name):
    # \`import util.text\` resolves to util/text.lune, relative to the entry's
    # directory (module_loader._search_roots), which is what /app is.
    return "/app/" + name.replace(".", "/") + ".lune"

def _write(source, modules="[]"):
    global _WRITTEN
    written = {ENTRY}
    with open(ENTRY, "w", encoding="utf-8") as f:
        f.write(source)
    for module in json.loads(modules):
        path = _module_file(module["n"])
        os.makedirs(os.path.dirname(path), exist_ok=True)
        with open(path, "w", encoding="utf-8") as f:
            f.write(module["c"])
        written.add(path)
    for stale in _WRITTEN - written:
        try:
            os.remove(stale)
        except OSError:
            pass
    _WRITTEN = written

def lune_check(source, lang="en", modules="[]"):
    set_language(lang)
    _write(source, modules)
    sm = SourceMap()
    out = io.StringIO()
    try:
        env = check_file(ENTRY, [], sm)
        for w in env.warnings:
            out.write(format_diagnostic(w, sm, explain_hint=True) + "\\n")
        out.write("type check OK\\n")
    except Exception as exc:
        out.write(format_exception(exc, sm, explain_hint=True) + "\\n")
    return out.getvalue()

def lune_run(source, binding, trace=False, lang="en", modules="[]"):
    set_language(lang)
    _write(source, modules)
    sm = SourceMap()
    out = io.StringIO()
    try:
        env = check_file(ENTRY, [], sm)
        for w in env.warnings:
            out.write(format_diagnostic(w, sm, explain_hint=True) + "\\n")
    except Exception as exc:
        out.write(format_exception(exc, sm, explain_hint=True) + "\\n")
        return out.getvalue()
    trace_lines = []
    if trace:
        set_trace_hook(lambda depth, message: trace_lines.append("  " * depth + message))
    try:
        with contextlib.redirect_stdout(out):
            env = eval_file(ENTRY, [], sm)
            binding = binding.strip()
            if binding:
                out.write(format_value(env.lookup_raw(binding)) + "\\n")
            else:
                out.write("(評価完了 — 束縛名を指定すると値を表示します)\\n")
    except Exception as exc:
        out.write(format_exception(exc, sm, explain_hint=True) + "\\n")
    finally:
        if trace:
            set_trace_hook(None)
    if trace_lines:
        return "\\n".join(trace_lines) + "\\n" + "-" * 40 + "\\n" + out.getvalue()
    return out.getvalue()

def lune_fmt(source, lang="en"):
    set_language(lang)
    try:
        return json.dumps({"ok": True, "text": format_source(source, "main.lune")})
    except Exception as exc:
        sm = SourceMap()
        sm.add("main.lune", source)
        return json.dumps({"ok": False, "text": format_exception(exc, sm, explain_hint=True)})

def lune_fix(source, lang="en"):
    set_language(lang)
    try:
        fixed, applied = apply_fixes(source, "main.lune")
        return json.dumps({"ok": True, "text": fixed, "applied": applied})
    except Exception as exc:
        sm = SourceMap()
        sm.add("main.lune", source)
        return json.dumps({"ok": False, "text": format_exception(exc, sm, explain_hint=True)})

def lune_explain(code, lang="en"):
    set_language(lang)
    code = code.strip()
    text = render_explanation(code, lang)
    if text is None:
        return "診断コード %r の解説はありません\\n利用可能: %s" % (code, ", ".join(available_codes()))
    return text

# --- REPL ---------------------------------------------------------------
# Drives lune.repl.ReplSession directly. repl_main is the terminal front end
# (it owns the prompt loop and readline); the browser owns those instead, so
# only the session, the SourceMap and the <repl:N> numbering are mirrored here.

_REPL = {"session": None, "sm": None, "n": 0}

def lune_repl_reset(lang="en"):
    set_language(lang)
    _REPL["sm"] = SourceMap()
    # /app is where the file tabs are written, so the REPL's \`import\` finds the
    # same modules 実行/型チェック do. The session needs the SourceMap too, or an
    # imported module's diagnostics print without the offending line.
    _REPL["session"] = ReplSession(["/app"], _REPL["sm"])
    _REPL["n"] = 0
    # 版番号は lune/__init__.py が唯一の出処。ここに数字を書き写すと端末の REPL と
    # 食い違う（実際 v0.1.0 になったときに食い違った）。
    return json.dumps({"kind": "banner", "text": f"Lune v{LUNE_VERSION} REPL — :help でコマンド一覧"})

def lune_repl_wants_more(line):
    # same rule as the terminal REPL, not a reimplementation
    return wants_more(line)

def lune_repl_submit(source, lang="en", entry="", modules="[]"):
    set_language(lang)
    if _REPL["session"] is None:
        lune_repl_reset(lang)
    # Keep /app in step with the file tabs, so that \`import geometry\` in the
    # REPL finds what 実行 would — whether or not the program has been run yet.
    _write(entry, modules)
    _REPL["n"] += 1
    filename = "<repl:%d>" % _REPL["n"]
    _REPL["sm"].add(filename, source)
    out = io.StringIO()
    try:
        # print/println inside the submitted code writes to stdout
        with contextlib.redirect_stdout(out):
            result = _REPL["session"].submit(source, filename)
        for w in result.warnings:
            out.write(format_diagnostic(w, _REPL["sm"], explain_hint=True) + "\\n")
        if result.kind != "empty" and result.message:
            out.write(result.message + "\\n")
        return json.dumps({"kind": result.kind, "text": out.getvalue()})
    except Exception as exc:
        out.write(format_exception(exc, _REPL["sm"], explain_hint=True) + "\\n")
        return json.dumps({"kind": "error", "text": out.getvalue()})
`;

const $ = (id) => document.getElementById(id);
const output = $("output"), status = $("status");
let py = null;
let cm = null;

function setStatus(msg) { status.textContent = msg; }

// --- editor (CodeMirror with a plain-textarea fallback) ---------------------

function initEditor() {
  if (typeof CodeMirror === "undefined") return; // CDN unavailable: keep the textarea
  CodeMirror.defineSimpleMode("lune", {
    start: [
      { regex: /###/, token: "comment", next: "blockComment" },
      { regex: /#.*/, token: "comment" },
      { regex: /"(?:[^\\"]|\\.)*"?/, token: "string" },
      { regex: /'(?:[^\\']|\\.)'/, token: "string" },
      { regex: /\b(?:let|var|def|type|record|match|if|then|elif|else|fn|lazy|force|strict|seq|deepForce|while|for|in|import|module|IO)\b/, token: "keyword" },
      { regex: /\b(?:true|false|null)\b/, token: "atom" },
      { regex: /\b\d+(?:\.\d+)?\b/, token: "number" },
      { regex: /\b[A-Z][\w]*\b/, token: "variable-2" },
      { regex: /\|>|->|\?\?|\?\.|==|!=|<=|>=|[+\-*\/%=<>!|&?]/, token: "operator" },
    ],
    blockComment: [
      { regex: /.*?###/, token: "comment", next: "start" },
      { regex: /.*/, token: "comment" },
    ],
    meta: { lineComment: "#" },
  });
  cm = CodeMirror.fromTextArea($("editor"), {
    mode: "lune",
    lineNumbers: true,
    indentUnit: 4,
    viewportMargin: Infinity,
  });
}

function getCode() { return cm ? cm.getValue() : $("editor").value; }
function setCode(text) { cm ? cm.setValue(text) : ($("editor").value = text); }

// --- files: main.lune, plus the modules it imports ------------------------------
//
// The editor shows one file at a time; the others are parked here. `name` is
// the import path as written in the program (`math`, `util.text`), and the
// entry's name is "" — it is always main.lune, is never renamed, and is the
// one that gets evaluated. The interpreter needs no help beyond the files
// themselves: module resolution searches the entry's own directory, so
// writing them side by side in /app is all `import` requires.
let files = [{ name: "", code: "" }];
let active = 0;

const fileLabel = (name) => (name === "" ? "main.lune" : name.replace(/\./g, "/") + ".lune");
const MODULE_NAME = /^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$/;

// Always read through to the editor for the active file: no syncing on every
// keystroke, and no way for the two to disagree.
function entryCode() { return active === 0 ? getCode() : files[0].code; }
function codeOf(i) { return i === active ? getCode() : files[i].code; }
function modulesJson() {
  return JSON.stringify(files.slice(1).map((f, i) => ({ n: f.name, c: codeOf(i + 1) })));
}

function renderFileBar() {
  const bar = $("filebar");
  bar.textContent = "";
  files.forEach((file, i) => {
    const tab = document.createElement("button");
    tab.className = "file" + (i === active ? " active" : "");
    tab.append(fileLabel(file.name));
    tab.onclick = () => switchFile(i);
    if (i > 0) {
      const close = document.createElement("span");
      close.className = "close";
      close.textContent = "×";
      close.title = `${fileLabel(file.name)} を削除`;
      close.onclick = (e) => { e.stopPropagation(); removeModule(i); };
      tab.append(close);
    }
    bar.append(tab);
  });
  const add = document.createElement("button");
  add.id = "btn-add-module";
  add.textContent = "＋ モジュール";
  add.title = "import で読み込むモジュールを追加する";
  add.onclick = addModule;
  bar.append(add);
}

function switchFile(i) {
  if (i === active) return;
  files[active].code = getCode();
  active = i;
  setCode(files[active].code);
  clearErrorLine();
  renderFileBar();
}

function addModule() {
  const name = (prompt("モジュール名 (import に書く名前。例: math, util.text)") || "").trim();
  if (!name) return;
  if (!MODULE_NAME.test(name)) { setStatus(`モジュール名として使えません: ${name}`); return; }
  if (files.some((f) => f.name === name)) { setStatus(`${fileLabel(name)} は既にあります`); return; }
  files[active].code = getCode();
  files.push({ name, code: `module ${name}\n\n` });
  active = files.length - 1;
  setCode(files[active].code);
  clearErrorLine();
  renderFileBar();
  setStatus(`${fileLabel(name)} を追加しました — main.lune に \`import ${name}\` を書くと使えます`);
}

function removeModule(i) {
  if (i === 0) return;
  if (!confirm(`${fileLabel(files[i].name)} を削除しますか?`)) return;
  files.splice(i, 1);
  if (active >= files.length) active = files.length - 1;
  else if (active > i) active -= 1;
  else if (active === i) active = 0;
  setCode(files[active].code);
  clearErrorLine();
  renderFileBar();
}

// Replace every buffer at once (a preset, a share link, 新規).
function setFiles(list) {
  files = list.length ? list.map((f) => ({ name: f.name || "", code: f.code || "" })) : [{ name: "", code: "" }];
  active = 0;
  setCode(files[0].code);
  clearErrorLine();
  renderFileBar();
}

let errorLine = null;
function clearErrorLine() {
  if (cm && errorLine !== null) cm.removeLineClass(errorLine, "background", "cm-error-line");
  errorLine = null;
}
function markErrorLineFrom(text) {
  clearErrorLine();
  if (!cm) return;
  // With modules the error may be in a file that is not on screen; highlighting
  // that line number in whatever happens to be open would point at innocent code.
  const m = text.match(/([\w/.-]+\.lune):(\d+):\d+/);
  if (!m || m[1].replace(/^\/app\//, "") !== fileLabel(files[active].name)) return;
  errorLine = Number(m[2]) - 1;
  cm.addLineClass(errorLine, "background", "cm-error-line");
}

// --- output ------------------------------------------------------------------

function colorize(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const linkCodes = (s) => s.replace(/\b([A-Z]{3}\d{4})\b/g, '<a class="diag" data-code="$1" title="クリックで explain">$1</a>');
  return text.split("\n").map((line) => {
    let cls = "";
    if (/^error\[/.test(line)) cls = "e";
    else if (/^warning\[/.test(line)) cls = "w";
    else if (/^\s*= hint:/.test(line)) cls = "h";
    else if (/^\s*= help:/.test(line)) cls = "x";
    else if (/^\s*force /.test(line)) cls = "tf";
    else if (/^\s*memo /.test(line)) cls = "tm";
    else if (/^\s*=> /.test(line)) cls = "tv";
    const html = linkCodes(esc(line));
    return cls ? `<span class="${cls}">${html}</span>` : html;
  }).join("\n");
}

function render(text) { output.innerHTML = colorize(text); }

// --- REPL --------------------------------------------------------------------

const repl = {
  buffer: [],      // lines of an unfinished multi-line entry
  history: [],     // submitted entries, oldest first
  cursor: 0,       // index into history; === length means "the live line"
  draft: "",       // the line being typed, stashed while browsing history
  ended: false,    // :quit was accepted; input stays closed until リセット
};

function replEcho(prompt, text) {
  replAppend(`<span class="echo">${prompt} </span>${colorize(text)}\n`);
}

function replAppend(html) {
  const log = $("repl-log");
  log.insertAdjacentHTML("beforeend", html);
  log.scrollTop = log.scrollHeight;
}

function replPrompt() {
  $("repl-prompt").textContent = repl.buffer.length ? "..." : "lune>";
}

function replReset(call, lang) {
  const banner = JSON.parse(call("lune_repl_reset", lang));
  repl.buffer = [];
  repl.ended = false;
  $("repl-log").innerHTML = "";
  replAppend(colorize(banner.text) + "\n");
  $("repl-line").disabled = false;
  replPrompt();
  $("repl-line").focus();
}

function replSubmit(call, lang, source) {
  const r = JSON.parse(call("lune_repl_submit", source, lang, entryCode(), modulesJson()));
  if (r.text) replAppend(colorize(r.text));
  if (r.kind === "quit") {
    repl.ended = true;
    $("repl-line").disabled = true;
    replAppend(`<span class="echo">(セッション終了 — 「リセット」で再開できます)</span>\n`);
  }
}

// Enter: buffer the line if it opens a block, otherwise submit. A blank line
// closes an open block — the same rule the terminal REPL uses.
function replOnEnter(call, lang) {
  if (repl.ended) return;
  const line = $("repl-line").value;
  $("repl-line").value = "";
  replEcho(repl.buffer.length ? "..." : "lune>", line);

  if (repl.buffer.length) {
    if (line.trim()) { repl.buffer.push(line); replPrompt(); return; }
  } else if (!line.trim()) {
    return;
  } else if (call("lune_repl_wants_more", line)) {
    repl.buffer.push(line);
    replPrompt();
    return;
  }

  const source = repl.buffer.length ? repl.buffer.join("\n") : line;
  repl.buffer = [];
  replPrompt();
  repl.history.push(source);
  repl.cursor = repl.history.length;
  replSubmit(call, lang, source);
}

function replOnHistory(dir) {
  const input = $("repl-line");
  if (!repl.history.length) return;
  if (repl.cursor === repl.history.length) repl.draft = input.value;
  const next = repl.cursor + dir;
  if (next < 0 || next > repl.history.length) return;
  repl.cursor = next;
  // a multi-line entry comes back as one line so it can be edited and resent
  input.value = next === repl.history.length ? repl.draft : repl.history[next].replace(/\n/g, " ");
  input.setSelectionRange(input.value.length, input.value.length);
}

// --- which binding to evaluate -------------------------------------------------

// The field follows the code until the user says otherwise: the last top-level
// value binding is almost always the one you want to look at, and having to
// retype it is a papercut. Once it is edited by hand we stop touching it.
let bindingTouched = false;

function syncBinding(call) {
  if (bindingTouched) return;
  const names = JSON.parse(call("lune_bindings", entryCode()));
  if (!names || !names.length) return;   // unparseable or nothing declared yet
  $("binding").value = names[names.length - 1];
}

// --- saving to a local file ---------------------------------------------------

// `lune fmt --check` reports "would reformat" on a file with no trailing
// newline, so a file saved from here would fail CI for a reason the user never
// typed. Add the newline on the way out.
function withTrailingNewline(text) {
  return text.endsWith("\n") ? text : text + "\n";
}

// Chromium has a real save dialog (and can overwrite the same file on a second
// save); everywhere else falls back to a download. Returns the name written,
// or null if the user cancelled.
async function saveToFile(text, suggestedName) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: "Lune source", accept: { "text/plain": [".lune"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      return handle.name;
    } catch (err) {
      if (err && err.name === "AbortError") return null;
      // permission denied, or a browser that has the name but not the feature:
      // fall through to the download path rather than losing the user's code
    }
  }
  const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // revoking synchronously can cancel the download in some browsers
  setTimeout(() => URL.revokeObjectURL(url), 0);
  return suggestedName;
}

// Mirror of saveToFile. Returns {name, text}, or null if the user cancelled.
async function openFromFile() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "Lune source", accept: { "text/plain": [".lune"] } }],
        multiple: false,
      });
      const file = await handle.getFile();
      return { name: file.name, text: await file.text() };
    } catch (err) {
      if (err && err.name === "AbortError") return null;
      // fall through to <input type="file"> just like the save path does
    }
  }
  return new Promise((resolve) => {
    const input = $("file-input");
    input.value = "";                     // so picking the same file twice still fires
    const done = (value) => { input.onchange = input.oncancel = null; resolve(value); };
    input.onchange = async () => {
      const file = input.files && input.files[0];
      done(file ? { name: file.name, text: await file.text() } : null);
    };
    input.oncancel = () => done(null);    // fires on a dismissed dialog
    input.click();
  });
}

// --- presets / share links ---------------------------------------------------

function loadPreset(name) {
  if (!name) return;                    // the "(なし)" entry is not a sample
  const preset = PRESETS[name];
  setFiles([{ name: "", code: preset.code }, ...(preset.modules || [])]);
  bindingTouched = false;               // the sample's own binding, not the user's
  $("binding").value = preset.binding;
  $("trace").checked = Boolean(preset.trace);
}

// Start from an empty buffer. There is only one buffer here, so this discards
// what is in the editor — hence the confirmation when it holds anything.
function newFile() {
  const anything = files.some((f, i) => codeOf(i).trim());
  if (anything && !confirm("エディタの内容を消して新規作成しますか?")) return false;
  setFiles([{ name: "", code: "" }]);
  // `main` as a hint of the convention on a blank slate; it gets replaced by
  // the real binding as soon as one is declared.
  bindingTouched = false;
  $("binding").value = "main";
  $("preset").value = "";
  clearErrorLine();
  if (cm) cm.focus(); else $("editor").focus();
  return true;
}

function encodeState() {
  const state = { c: entryCode(), b: $("binding").value, t: $("trace").checked, l: $("lang").value };
  // `m` only when there is something to carry: a single-file link stays exactly
  // as short as it was, and the book's generated links keep working unchanged.
  if (files.length > 1) state.m = JSON.parse(modulesJson());
  const utf8 = unescape(encodeURIComponent(JSON.stringify(state)));
  return btoa(utf8).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeState(hash) {
  try {
    const b64 = hash.replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch {
    return null;
  }
}

function applySharedState() {
  const m = location.hash.match(/^#s=(.+)$/);
  if (!m) return false;
  const state = decodeState(m[1]);
  if (!state || typeof state.c !== "string") return false;
  const modules = Array.isArray(state.m) ? state.m : [];
  setFiles([{ name: "", code: state.c }, ...modules.map((m) => ({ name: m.n, code: m.c }))]);
  $("binding").value = state.b ?? "";
  // A binding in the link is the sharer's choice, so stop the field following
  // the code — otherwise syncBinding replaces it with the last declaration as
  // soon as the interpreter finishes loading. An empty one means "you decide",
  // which is what the book's links send: the real parser picks better than a
  // link generator could.
  // Assigned, not just set: a second link applied through hashchange must not
  // inherit "the user chose this" from the link before it.
  bindingTouched = Boolean(state.b);
  $("trace").checked = Boolean(state.t);
  if (state.l === "en" || state.l === "ja") $("lang").value = state.l;
  return true;
}

// --- wiring --------------------------------------------------------------------

async function timed(label, fn) {
  const t0 = performance.now();
  const result = await fn();
  setStatus(`${label}: ${Math.round(performance.now() - t0)} ms`);
  return result;
}

async function main() {
  initEditor();
  // the selector names what is in the editor, so a shared link leaves it on "(なし)"
  if (applySharedState()) $("preset").value = "";
  else { loadPreset("basics"); $("preset").value = "basics"; }
  $("preset").addEventListener("change", (e) => loadPreset(e.target.value));

  // Pasting a share link into a tab that already holds the Playground only
  // changes the fragment: the browser does not reload, so nothing would
  // happen. (The 共有 button uses replaceState, which fires no hashchange.)
  window.addEventListener("hashchange", () => {
    if (applySharedState()) { $("preset").value = ""; setStatus("共有リンクを読み込みました"); }
  });

  $("btn-new").onclick = () => {
    // Cmd/Ctrl+N is taken by the browser ("new window") and cannot be
    // intercepted, so this one is button-only on purpose.
    if (newFile()) {
      render("空のエディタです。書いたら「▶ 実行」(Ctrl/Cmd+Enter)。\n");
      setStatus("新規作成しました");
    }
  };
  $("btn-new").disabled = false;

  $("btn-open").onclick = async () => {
    const file = await openFromFile();
    if (!file) { setStatus("読み込みをキャンセルしました"); return; }
    setCode(file.text);
    clearErrorLine();
    $("preset").value = "";            // the editor no longer holds a sample
    bindingTouched = false;            // follow the file we just opened
    syncBinding(call);
    const lines = file.text.split("\n").length;
    setStatus(`${file.name} を読み込みました (${lines} 行)`);
  };
  $("btn-open").disabled = false;

  $("btn-save").onclick = async () => {
    // The file on screen, under the name the program refers to it by — so a
    // saved module lands next to main.lune and `import` still resolves.
    const suggested = fileLabel(files[active].name).replace(/^.*\//, "");
    const name = await saveToFile(withTrailingNewline(getCode()), suggested);
    setStatus(name ? `${name} を保存しました` : "保存をキャンセルしました");
  };
  $("btn-save").disabled = false;
  // Ctrl/Cmd+S is the gesture people already have in their fingers; CodeMirror
  // does not bind it, so the event reaches us wherever the focus is.
  document.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const key = e.key.toLowerCase();
    if (key === "s") { e.preventDefault(); $("btn-save").onclick(); }
    else if (key === "o") { e.preventDefault(); $("btn-open").onclick(); }
  });

  $("btn-share").onclick = () => {
    history.replaceState(null, "", "#s=" + encodeState());
    navigator.clipboard?.writeText(location.href);
    setStatus("共有リンクをコピーしました");
  };
  $("btn-share").disabled = false;

  const explainOnClick = (e) => {
    const code = e.target?.dataset?.code;
    if (!code || !py) return;
    $("explain-code").value = code;
    showTab("output");
    $("btn-explain").onclick();
  };
  output.addEventListener("click", explainOnClick);
  $("repl-log").addEventListener("click", explainOnClick);

  function showTab(which) {
    const isRepl = which === "repl";
    $("output").hidden = isRepl;
    $("repl").hidden = !isRepl;
    $("tab-output").classList.toggle("active", !isRepl);
    $("tab-repl").classList.toggle("active", isRepl);
    if (isRepl && !repl.ended) $("repl-line").focus();
  }
  $("tab-output").onclick = () => showTab("output");
  $("tab-repl").onclick = () => showTab("repl");

  const t0 = performance.now();
  py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
  const tPyodide = Math.round(performance.now() - t0);

  py.FS.mkdirTree("/app/lune");
  const t1 = performance.now();
  await Promise.all(LUNE_FILES.map(async (f) => {
    const res = await fetch(`../lune/${f}`, { cache: "no-cache" });
    if (!res.ok) throw new Error(`fetch failed: lune/${f}`);
    py.FS.writeFile(`/app/lune/${f}`, await res.text());
  }));
  py.runPython(DRIVER);
  const tLune = Math.round(performance.now() - t1);

  setStatus(`起動完了 — Pyodide ${tPyodide} ms + Lune ${tLune} ms (Python ${py.runPython("import sys; sys.version.split()[0]")})`);
  render("処理系の準備ができました。「▶ 実行」(Ctrl/Cmd+Enter)を押してください。\n");

  const call = (name, ...args) => py.globals.get(name)(...args);

  // Track the field so we can tell "the user chose this" from "we filled it in",
  // then keep it in step with the editor until they do choose.
  $("binding").addEventListener("input", () => { bindingTouched = true; });
  let bindingTimer = null;
  const scheduleBindingSync = () => {
    clearTimeout(bindingTimer);
    bindingTimer = setTimeout(() => syncBinding(call), 250);
  };
  if (cm) cm.on("change", scheduleBindingSync);
  else $("editor").addEventListener("input", scheduleBindingSync);
  syncBinding(call);                    // catch up with whatever loaded first

  // Run and check always mean the whole program: main.lune is the entry even
  // when a module tab is the one on screen.
  $("btn-run").onclick = () => timed("実行", async () => {
    const text = call("lune_run", entryCode(), $("binding").value, $("trace").checked, $("lang").value, modulesJson());
    render(text);
    markErrorLineFrom(text);
  });
  $("btn-check").onclick = () => timed("型チェック", async () => {
    const text = call("lune_check", entryCode(), $("lang").value, modulesJson());
    render(text);
    markErrorLineFrom(text);
  });
  $("btn-fmt").onclick = () => timed("整形", async () => {
    const r = JSON.parse(call("lune_fmt", getCode(), $("lang").value));
    if (r.ok) { setCode(r.text); clearErrorLine(); render("(整形しました)\n"); } else render(r.text);
  });
  $("btn-fix").onclick = () => timed("自動修正", async () => {
    const r = JSON.parse(call("lune_fix", getCode(), $("lang").value));
    if (r.ok) { setCode(r.text); clearErrorLine(); render(`(自動修正: ${r.applied} 件適用)\n`); } else render(r.text);
  });
  // With an empty box this used to explain TYP0007 unconditionally, so a
  // beginner who had never written a `match` was told about non-exhaustive
  // matches. Reach for the code that is actually on screen instead: pressing
  // explain while looking at an error should explain *that* error.
  const visibleDiagnosticCode = () => {
    const panes = $("repl").hidden ? [output, $("repl-log")] : [$("repl-log"), output];
    for (const pane of panes) {
      const m = pane.textContent.match(/\b([A-Z]{3}\d{4})\b/);
      if (m) return m[1];
    }
    return null;
  };

  $("btn-explain").onclick = () => timed("explain", async () => {
    const typed = $("explain-code").value.trim();
    const code = typed || visibleDiagnosticCode();
    if (!code) {
      showTab("output");
      render(
        "解説したい診断コードを入れてから「explain」を押してください(例: TYP0007)。\n\n" +
        "エラーが出ているときは、欄を空のままにしておけば、そのエラーの解説が開きます。\n" +
        "出力に現れた診断コードをクリックしても同じです。\n\n" +
        "全コードの一覧は「診断カタログ」のページにあります。\n");
      return;
    }
    if (!typed) $("explain-code").value = code;   // show which code was used
    showTab("output");
    render(call("lune_explain", code, $("lang").value));
  });

  // --- REPL wiring ---
  const lang = () => $("lang").value;
  replReset(call, lang());
  $("repl").hidden = true;          // replReset focuses the input; start on 出力

  $("repl-line").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); timed("REPL", async () => replOnEnter(call, lang())); }
    else if (e.key === "ArrowUp") { e.preventDefault(); replOnHistory(-1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); replOnHistory(1); }
  });
  $("btn-repl-reset").onclick = () => replReset(call, lang());
  $("btn-repl-load").onclick = () => timed("REPL に読み込み", async () => {
    showTab("repl");
    if (repl.ended) replReset(call, lang());
    const source = getCode().replace(/\n+$/, "");
    if (!source.trim()) return;
    replEcho("lune>", "(エディタの内容)");
    replSubmit(call, lang(), source);
  });
  // the session was built with the language selected at load time
  $("lang").addEventListener("change", () => replReset(call, lang()));

  if (cm) {
    cm.setOption("extraKeys", {
      "Ctrl-Enter": () => $("btn-run").onclick(),
      "Cmd-Enter": () => $("btn-run").onclick(),
    });
  }

  for (const id of ["btn-run","btn-check","btn-fmt","btn-fix","btn-explain",
                    "btn-repl-load","btn-repl-reset"])
    $(id).disabled = false;
}

main().catch((e) => { render(`起動に失敗しました:\n${e}`); setStatus("エラー"); });
</script>
</body>
</html>
