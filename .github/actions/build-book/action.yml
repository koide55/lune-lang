name: Build the book
description: >
  Build an mdBook edition into HTML and, optionally, a single-file PDF, and
  check that the PDF is readable. Shared by the Pages deploy (which publishes
  the result) and CI (which only wants to know that it still builds).

inputs:
  book:
    description: The mdBook project to build.
    required: false
    default: books/lune-book
  dest:
    description: Directory to write the book into. The PDF lands in it as lune-book.pdf.
    required: true
  pdf-must-contain:
    description: >
      A string that must appear in the PDF's text layer. A PDF can be produced
      and still be unreadable — a missing CJK font prints boxes — so this is
      how the build knows the text really came through.
    required: false
    default: プログラミング言語 Lune
  pdf:
    description: >
      Build the single-file PDF as well. The English edition is still being
      written, and a PDF whose contents page numbers half a book is worse than
      no PDF, so it stays off there until the translation is complete.
    required: false
    default: "true"
  mdbook-version:
    description: mdBook release to use.
    required: false
    default: "0.5.4"

runs:
  using: composite
  steps:
    - name: Install mdBook
      shell: bash
      run: |
        set -euxo pipefail
        version="${{ inputs.mdbook-version }}"
        url="https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "$url" | tar -xz -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # A python of our own: the system one is PEP 668 protected, and pikepdf
    # (which injects the PDF bookmarks) has to be installable.
    - uses: actions/setup-python@v5
      if: inputs.pdf == 'true'
      with:
        python-version: "3.12"

    # poppler-utils: the PDF build measures page numbers with pdftotext.
    # fonts-noto-cjk: without a CJK font the whole book prints as tofu, and
    # the runner has none by default.
    - name: Install the PDF toolchain
      if: inputs.pdf == 'true'
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
        python -m pip install pikepdf

    - name: Build the book (HTML)
      shell: bash
      run: mdbook build "${{ inputs.book }}" --dest-dir "${{ inputs.dest }}"

    # Two passes plus a self-check; see books/tools/build_pdf.sh. Chrome is
    # preinstalled on the runner and the script finds it on PATH.
    - name: Build the book (PDF)
      if: inputs.pdf == 'true'
      shell: bash
      env:
        # build_pdf.sh takes the directory name under books/, not a path
        BOOK: ${{ inputs.book == 'books/lune-book-en' && 'lune-book-en' || 'lune-book' }}
      run: books/tools/build_pdf.sh "${{ inputs.dest }}/lune-book.pdf"

    # A PDF can be produced and still be unreadable — a missing CJK font
    # prints boxes, and a broken print.html prints a stub. Check that the
    # text layer really carries the book.
    - name: Check the PDF
      if: inputs.pdf == 'true'
      shell: bash
      run: |
        set -euxo pipefail
        # Join the lines before matching: a title long enough to wrap is split
        # across two lines in the text layer, and the English cover does wrap
        # ("The Lune Programming" / "Language").
        pdftotext "${{ inputs.dest }}/lune-book.pdf" - | tr '\n' ' ' | tr -s ' ' \
            | grep -q "${{ inputs.pdf-must-contain }}"
        pages=$(pdfinfo "${{ inputs.dest }}/lune-book.pdf" | awk '/^Pages:/ {print $2}')
        test "$pages" -ge 150

    # mdBook CREATES a missing chapter file instead of failing, so a SUMMARY
    # entry pointing at a typo'd filename builds green while that chapter
    # silently disappears from the book. The give-away is a dirtied tree.
    # build_pdf.sh also rewrites the TOC and index during the build and
    # restores them on exit; this catches a restore that did not happen.
    - name: The build must not have changed the sources
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain books/)" ]; then
          echo "error: building the book modified books/ — see below" >&2
          git status --porcelain books/ >&2
          git diff -- books/ >&2
          exit 1
        fi
