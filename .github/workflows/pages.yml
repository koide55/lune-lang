name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The textbook is the one part of the site that has to be built. Its
      # sources live in books/lune-book/; the HTML goes to /book/ and the PDF
      # to /book/lune-book.pdf, so both have a stable URL to link to.
      # CI runs the same action on every PR, so a break lands before here.
      - uses: ./.github/actions/build-book
        with:
          dest: ${{ github.workspace }}/book

      # The English edition, under /book/en/. No PDF while it is unfinished.
      - uses: ./.github/actions/build-book
        with:
          book: books/lune-book-en
          dest: ${{ github.workspace }}/book/en
          pdf: "false"

      - uses: actions/upload-pages-artifact@v3
        with:
          # The site is the repo itself: landing page at /, playground/ fetches
          # ../lune/*.py, errors.html fetches ../documents/ERROR_INDEX*.md, and
          # book/ is the textbook built above.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
